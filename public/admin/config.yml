backend:
  name: git-gateway
  branch: main

# Edits land on a short-lived branch and open a PR for review before going live,
# matching the brand → PR → preview → merge workflow.
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

# The CMS now lives at houseofcanwell.co.uk/admin. Backend repo/branch are
# unchanged, so this is still a single CMS — these URLs only set where the
# editor's "live site" links and previews point.
site_url: https://houseofcanwell.co.uk
display_url: https://houseofcanwell.co.uk
logo_url: https://houseofcanwell.co.uk/brand/House%20of%20Canwell%20logo%20long%20white.png

collections:
  - name: home
    label: Home page
    description: Headline copy for each section of the home page.
    files:
      - name: home
        label: Home page
        file: content/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Button label, name: ctaLabel, widget: string }
              - { label: Button link, name: ctaHref, widget: string, hint: "Use mailto: for an email link" }
              - { label: Background image, name: image, widget: image }
          - label: The Group
            name: group
            widget: object
            fields:
              - { label: "Show this section on the site", name: visible, widget: boolean, default: true, required: false }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: The Model
            name: model
            widget: object
            fields:
              - { label: "Show this section on the site", name: visible, widget: boolean, default: true, required: false }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Enquiries
            name: enquiries
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Email intro line, name: emailIntro, widget: string, hint: "Text before the email address, e.g. 'Or email the group directly at'" }
              - label: Contact form
                name: form
                widget: object
                fields:
                  - { label: Name field label, name: nameLabel, widget: string }
                  - { label: Email field label, name: emailLabel, widget: string }
                  - { label: Organisation field label, name: organisationLabel, widget: string }
                  - { label: Enquiry type field label, name: enquiryTypeLabel, widget: string }
                  - label: Enquiry type options
                    name: enquiryTypes
                    widget: list
                    field: { label: Option, name: option, widget: string }
                  - { label: Message field label, name: messageLabel, widget: string }
                  - { label: Submit button label, name: submitLabel, widget: string }
                  - { label: Submitting button label, name: submittingLabel, widget: string }
                  - { label: Verification error, name: verificationError, widget: string }
                  - { label: Success heading, name: successHeading, widget: string }
                  - { label: Success body, name: successBody, widget: text }

  - name: brands
    label: Brands
    description: The three trading brands shown on the home page.
    files:
      - name: brands
        label: Brands
        file: content/brands.json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - label: Brands
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Index, name: index, widget: string, hint: "e.g. 01" }
              - { label: Tier, name: tier, widget: string, hint: "e.g. RETAIL · ONLINE" }
              - { label: Name, name: name, widget: string }
              - { label: Website, name: url, widget: string }
              - { label: Logo, name: logo, widget: image }
              - { label: Logo width (px), name: logoWidth, widget: number, value_type: int }
              - { label: Logo height (px), name: logoHeight, widget: number, value_type: int }
              - { label: Logo size classes, name: logoClass, widget: string, hint: "Tailwind height, e.g. h-7 sm:h-8" }
              - { label: Descriptor, name: descriptor, widget: text }

  - name: settings
    label: Settings
    description: Site-wide details and SEO.
    files:
      - name: settings
        label: Settings
        file: content/settings.json
        fields:
          - { label: Contact email, name: contactEmail, widget: string }
          - label: Logo
            name: logo
            widget: object
            hint: "Shown in the header and footer. Keep width and height matched to the image's real pixel dimensions."
            fields:
              - { label: Image, name: src, widget: image }
              - { label: Alt text, name: alt, widget: string }
              - { label: Width (px), name: width, widget: number, value_type: int }
              - { label: Height (px), name: height, widget: number, value_type: int }
          - label: Header
            name: header
            widget: object
            fields:
              - { label: Navigation button label, name: ctaLabel, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Descriptor line, name: descriptor, widget: string }
              - { label: Legal line, name: legal, widget: text }
              - { label: Copyright line, name: copyright, widget: string }
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
