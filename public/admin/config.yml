backend:
  name: git-gateway
  branch: main

# Edits land on a short-lived branch and open a PR for review before going live,
# matching the brand → PR → preview → merge workflow.
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

# The CMS now lives at houseofcanwell.co.uk/admin. Backend repo/branch are
# unchanged, so this is still a single CMS — these URLs only set where the
# editor's "live site" links and previews point.
site_url: https://houseofcanwell.co.uk
display_url: https://houseofcanwell.co.uk
logo_url: https://houseofcanwell.co.uk/brand/House%20of%20Canwell%20logo%20long%20white.png

collections:
  - name: home
    label: Home page
    description: Copy for each section of the home page. A line break inside a heading breaks the line on the site.
    files:
      - name: home
        label: Home page
        file: content/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: text }
              - { label: Body, name: body, widget: text }
              - { label: Primary button label, name: primaryCtaLabel, widget: string }
              - { label: Primary button link, name: primaryCtaHref, widget: string, hint: "Use #brands, #places or #enquiries to jump down the page, or mailto: for an email link" }
              - { label: Secondary link label, name: secondaryCtaLabel, widget: string }
              - { label: Secondary link, name: secondaryCtaHref, widget: string }
              - { label: Background image, name: image, widget: image }
              - { label: Background image description, name: imageAlt, widget: string }
              - { label: Tagline (bottom of hero), name: tagline, widget: string }
          - label: Introduction
            name: intro
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: text }
              - { label: Body, name: body, widget: text }
          - label: Our locations
            name: places
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: text }
              - { label: Body, name: body, widget: text }
              - label: Locations
                name: locations
                widget: list
                summary: "{{fields.area}}"
                fields:
                  - { label: Area, name: area, widget: string, hint: "e.g. North Birmingham" }
                  - { label: Brands there, name: brands, widget: text, hint: "One line per row, e.g. Canwell Interiors · Saverys" }
          - label: Enquiries
            name: enquiries
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: text }
              - { label: Body, name: body, widget: text }
              - { label: Open form button label, name: openLabel, widget: string }
              - { label: Email intro line, name: emailIntro, widget: string, hint: "Text before the email address, e.g. 'Or email us directly at'" }
              - label: Contact form
                name: form
                widget: object
                fields:
                  - { label: Name field label, name: nameLabel, widget: string }
                  - { label: Name placeholder, name: namePlaceholder, widget: string }
                  - { label: Email field label, name: emailLabel, widget: string }
                  - { label: Email placeholder, name: emailPlaceholder, widget: string }
                  - { label: Interest field label, name: enquiryTypeLabel, widget: string }
                  - label: Interest options
                    name: enquiryTypes
                    widget: list
                    field: { label: Option, name: option, widget: string }
                  - { label: Message field label, name: messageLabel, widget: string }
                  - { label: Message placeholder, name: messagePlaceholder, widget: string }
                  - { label: Submit button label, name: submitLabel, widget: string }
                  - { label: Submitting button label, name: submittingLabel, widget: string }
                  - { label: Privacy note, name: privacyNote, widget: string }
                  - { label: Verification error, name: verificationError, widget: string }
                  - { label: Success heading, name: successHeading, widget: string }
                  - { label: Success body, name: successBody, widget: text }

  - name: brands
    label: Brands
    description: The trading brands shown on the home page.
    files:
      - name: brands
        label: Brands
        file: content/brands.json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - label: Brands
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Index, name: index, widget: string, hint: "e.g. 01" }
              - { label: Tier, name: tier, widget: string, hint: "Shown beside the index, e.g. Showhome furniture" }
              - { label: Name, name: name, widget: string }
              - { label: Website, name: url, widget: string }
              - { label: Logo, name: logo, widget: image }
              - { label: Logo width (px), name: logoWidth, widget: number, value_type: int }
              - { label: Logo height (px), name: logoHeight, widget: number, value_type: int }
              - { label: Logo size classes, name: logoClass, widget: string, hint: "Tailwind max height, e.g. max-h-12" }
              - { label: Logo panel, name: panel, widget: select, options: [ink, paper], default: ink, required: false, hint: "Dark ink for white logos; paper for dark artwork" }
              - { label: Caption under logo, name: caption, widget: string, required: false, hint: "e.g. Of Broadway and Ludlow" }
              - { label: Name set in type beside the logo, name: logoText, widget: text, required: false, hint: "Only for an emblem with no wordmark" }
              - { label: Descriptor, name: descriptor, widget: text }
              - { label: Link label, name: ctaLabel, widget: string, hint: "e.g. Explore Xshowhome" }

  - name: settings
    label: Settings
    description: Site-wide details and SEO.
    files:
      - name: settings
        label: Settings
        file: content/settings.json
        fields:
          - { label: Contact email, name: contactEmail, widget: string }
          - label: Logo
            name: logo
            widget: object
            hint: "Shown in the header and footer. Keep width and height matched to the image's real pixel dimensions."
            fields:
              - { label: Image, name: src, widget: image }
              - { label: Alt text, name: alt, widget: string }
              - { label: Width (px), name: width, widget: number, value_type: int }
              - { label: Height (px), name: height, widget: number, value_type: int }
          - label: Header
            name: header
            widget: object
            fields:
              - { label: Brands link label, name: brandsLabel, widget: string }
              - { label: Locations link label, name: placesLabel, widget: string }
              - { label: Enquiry link label, name: ctaLabel, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Descriptor line, name: descriptor, widget: string }
              - { label: Legal line, name: legal, widget: text }
              - { label: Copyright line, name: copyright, widget: string }
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
