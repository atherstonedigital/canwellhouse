[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* values are public by design: Next.js inlines them into the
  # client bundle, so Netlify's secrets scanner will always find them in build
  # output. The GA4 measurement ID and Turnstile site key are safe to expose.
  # TURNSTILE_SECRET_KEY is intentionally NOT listed: the scanner must keep
  # failing the build if that ever leaks into output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GA4_ID,NEXT_PUBLIC_TURNSTILE_SITE_KEY"

# Basic auth on the private reports area only. Two entries because "/reports/*"
# matches nested paths but not "/reports" itself. Must not run anywhere else.
[[edge_functions]]
  function = "reports-auth"
  path = "/reports"

[[edge_functions]]
  function = "reports-auth"
  path = "/reports/*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
